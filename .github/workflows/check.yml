# Run the tests and the checks of the payload source. On a release tag, run the release checks
# and verify each upstream plugin against its release asset.
name: check
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test scripts/test/
      - run: node scripts/check.mjs
      - if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/check.mjs --release --fetch
